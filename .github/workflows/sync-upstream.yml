name: Sync official Morphe patches

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: youtube-productivity-sync
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  sync:
    name: Sync the official patches
    runs-on: ubuntu-latest
    steps:
      - name: Check out the personal source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for an official update
        id: upstream
        run: |
          git remote add upstream https://github.com/MorpheApp/morphe-patches.git || git remote set-url upstream https://github.com/MorpheApp/morphe-patches.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the official update
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git config user.name 'YouTube Productivity sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff upstream/main -m 'chore: Sync official Morphe patches'
          git commit --allow-empty -m 'build(Needs bump): synchronize official Morphe patches'
          git push origin HEAD:main

      - name: Publish the refreshed patch source
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
